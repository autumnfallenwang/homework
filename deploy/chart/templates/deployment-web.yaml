apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homework.fullname" (dict "context" . "component" "web") }}
  labels:
    {{- include "homework.labels" (dict "context" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  # No explicit strategy — k8s default RollingUpdate is correct for the
  # stateless Next.js tier. The api Deployment needs Recreate (scheduler
  # singleton); web has no equivalent constraint.
  selector:
    matchLabels:
      {{- include "homework.selectorLabels" (dict "context" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homework.selectorLabels" (dict "context" . "component" "web") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          # NEXT_PUBLIC_API_URL is baked into the client bundle at build time
          # (Dockerfile.web ARG) for browser fetches. API_URL (runtime env
          # below) is the in-cluster Service DNS the web's server-side fetches
          # use to reach the API from inside the pod.
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.web.service.targetPort }}
              protocol: TCP
          env:
            {{- range $k, $v := .Values.web.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.web.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.web.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
